# frpc.toml — copy this to your frpc working dir, fill in authToken,
# certificate paths, and (optional) override customDomains, then run:
#   frpc -c frpc.toml
#
# Architecture (frps does NOT terminate TLS — frpc does, via the
# https2http plugin):
#
#   browser (https://ccanywhere.recoco.xyz)
#     → frps @ recoco.xyz:443 (SNI route only, no TLS termination)
#       → frpc on this host
#         → https2http plugin (terminates TLS with cert below)
#           → ccanywhere @ 127.0.0.1:62275 (plain HTTP)
#
# Required on frps (recoco.xyz):
#   - vhostHTTPSPort = 443 in frps.toml
#   - matching auth.token
#
# Required on THIS host (where frpc runs):
#   - TLS certificate + private key covering ccanywhere.recoco.xyz
#     (Let's Encrypt with DNS-01 challenge, or a wildcard *.recoco.xyz cert)
#     placed at crtPath / keyPath below.
#
# Required DNS:
#   - ccanywhere.recoco.xyz A or CNAME pointing at recoco.xyz's IP.
#
# `localPort` MUST match `port` in your ccanywhere config.json (default
# 62275 — see examples/config.json).

serverAddr = "recoco.xyz"
serverPort = 7000

auth.method = "token"
auth.token = "REPLACE-WITH-YOUR-FRPS-TOKEN"

[[proxies]]
name = "ccanywhere"
type = "https"
customDomains = ["ccanywhere.recoco.xyz"]

[proxies.plugin]
type = "https2http"
localAddr = "127.0.0.1:62275"
# Absolute paths — frp does NOT expand `~`. On macOS expand $HOME yourself,
# e.g. /Users/<you>/.config/ccanywhere/certs/ccanywhere.recoco.xyz.crt
crtPath = "/Users/<you>/.config/ccanywhere/certs/ccanywhere.recoco.xyz.crt"
keyPath = "/Users/<you>/.config/ccanywhere/certs/ccanywhere.recoco.xyz.key"
hostHeaderRewrite = "ccanywhere.recoco.xyz"
