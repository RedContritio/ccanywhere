# frpc.toml — copy this to your frpc working dir, fill in authToken,
# then run:  frpc -c frpc.toml
#
# THIS IS THE SIMPLIFIED HTTP-ONLY VARIANT for getting end-to-end
# connectivity working first. No certificates, no vhost, no custom
# domain — just a raw TCP tunnel from frps:62275 to ccanywhere on the
# local machine.
#
# Topology:
#   browser (http://recoco.xyz:62275)
#     → frps @ recoco.xyz:62275 (frps owns this port)
#       → frpc on this host
#         → ccanywhere @ 127.0.0.1:62275 (plain HTTP)
#
# Required on frps (recoco.xyz):
#   - port 62275 reachable on the public network (firewall open)
#   - matching auth.token in frps.toml
#
# Required on THIS host (where frpc and ccanywhere both run):
#   - ccanywhere built and started (its config.port matches localPort)
#
# After things work end-to-end, switch back to the https variant:
# vhost + https2http plugin + cert files. The https flow is documented
# in the previous git revisions of this file (search for `type = "https"`
# in the history).

serverAddr = "recoco.xyz"
serverPort = 7000

auth.method = "token"
auth.token = "REPLACE-WITH-YOUR-FRPS-TOKEN"

[[proxies]]
name = "ccanywhere"
type = "tcp"
localIP = "127.0.0.1"
localPort = 62275
remotePort = 62275
