name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: typecheck + lint + unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck:all

      - name: Lint (eslint + md line cap)
        run: |
          pnpm lint
          pnpm lint:md

      - name: Unit tests (root + web)
        run: pnpm test:all

      - name: Build (web + cli)
        run: pnpm build:all
