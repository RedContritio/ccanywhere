name: Feature request
description: 提议新功能或增强
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ccanywhere 是单用户单服务的 LaunchAgent 工具,设计原则在
        README "## 设计原则" 段。提议前请确认特性符合设计边界
        (例如 multi-tenant / 协同编辑 不在范围)。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想做什么?为什么现状不够?
    validations:
      required: true

  - type: textarea
    id: proposed-behavior
    attributes:
      label: 期望行为
      description: 理想情况下功能怎么工作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他方案为什么不合适

  - type: textarea
    id: additional
    attributes:
      label: 额外上下文
